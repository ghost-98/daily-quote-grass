<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Quote Garden</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Daily Quote Garden</p>
        <h1 id="quoteText">오늘의 명언을 불러오는 중입니다.</h1>
        <p id="quoteMeta" class="meta"></p>
      </section>

      <section class="dashboard" aria-label="명언 기록 현황">
        <article>
          <span>총 기록</span>
          <strong id="totalCount">0</strong>
        </article>
        <article>
          <span>마지막 기록일</span>
          <strong id="latestDate">-</strong>
        </article>
        <article>
          <span>출처</span>
          <strong id="sourceName">-</strong>
        </article>
      </section>

      <section class="history-section">
        <div class="section-title">
          <h2>기록 히스토리</h2>
          <a href="https://zenquotes.io/" target="_blank" rel="noreferrer">ZenQuotes API</a>
        </div>
        <ol id="historyList" class="history"></ol>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
