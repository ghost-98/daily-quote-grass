name: Daily Quote

on:
  workflow_dispatch:
  schedule:
    # KST 00:10
    - cron: "10 15 * * *"

permissions:
  contents: write

jobs:
  plant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Plant daily quote
        run: npm run plant

      - name: Build commit message
        run: echo "COMMIT_MESSAGE=$(node scripts/print-commit-message.js)" >> "$GITHUB_ENV"

      - name: Commit daily quote
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add README.md data/history.json data/latest.json quotes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi
